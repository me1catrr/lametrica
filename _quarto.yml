project:
  type: book
  output-dir: _book
  # La documentación original de la tesis NO se renderiza ni se publica.
  render:
    - index.qmd
    - book/**/*.qmd
  resources:
    - web/ojs/*.js
    - web/datos/*.json

# Los capítulos y las partes se generan desde temario.toml (scripts/generar_estructura.jl).
metadata-files:
  - _navegacion.yml

book:
  title: "La métrica"
  subtitle: "De la geometría de las superficies a los elementos finitos"
  author: "Rafael Castro Triguero"
  description: "Geometría diferencial · Cálculo tensorial · Mecánica de láminas"
  language: es
  search: true
  sidebar:
    style: docked

# Ejercicios intercalados y lista de referencias por tema (véanse scripts/*.lua).
filters:
  - scripts/ejercicios.lua
  - scripts/referencias.lua

lang: es
bibliography: bib/lametrica.bib
citations-hover: true
link-citations: true
reference-section-title: "Referencias"
citation-location: margin

# Nombres en español de los entornos numerados (def-, thm-, prp-, exm-…).
crossref:
  fig-title: "Figura"
  tbl-title: "Tabla"
  eq-prefix: "ecuación"
  thm-title: "Teorema"
  prp-title: "Proposición"
  def-title: "Definición"
  exm-title: "Ejemplo"
  lem-title: "Lema"
  cor-title: "Corolario"

format:
  html:
    theme: [cosmo, styles/lametrica.scss]
    html-math-method: mathjax
    toc: true
    toc-depth: 3
    code-copy: true
    number-sections: true
    callout-appearance: simple
  # pdf: se configurará en una fase posterior (requiere LaTeX/Typst)

execute:
  freeze: auto
