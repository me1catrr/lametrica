# =============================================================================
# La métrica — temario (fuente de verdad del índice)
# -----------------------------------------------------------------------------
# Bloques → temas. scripts/generar_estructura.jl genera a partir de este fichero:
#   _navegacion.yml  (capítulos de la barra lateral: solo los temas con archivo)
#   book/mapa.qmd    («Mapa del libro» público: título, estado y prerrequisitos)
# Campos de cada tema: id, titulo, estado ("publicado" | "borrador" | "pendiente"),
# archivo (ruta del .qmd; vacío si aún no existe), requiere (ids), pregunta (guía).
# El campo `fuente_interna` es de planificación: NO se publica en el mapa.
# =============================================================================

[libro]
titulo = "La métrica"
subtitulo = "De la geometría de las superficies a los elementos finitos"

# ---------------------------------------------------------------- Bloque A
[[bloque]]
id = "A"
titulo = "Preludio: la forma que resiste"
pregunta = "¿Por qué una cáscara de pocos centímetros puede cubrir una gran luz, y qué necesitamos saber para calcularla?"
  [[bloque.tema]]
  id = "A1"
  titulo = "La cáscara y el paraboloide hiperbólico"
  estado = "publicado"
  archivo = "book/A-preludio/A1-caparazon-hypar.qmd"
  requiere = []
  fuente_interna = "Introduccion.tex (historia de Candela)"
  [[bloque.tema]]
  id = "A2"
  titulo = "Los objetos físicos no dependen de las coordenadas"
  estado = "publicado"
  archivo = "book/A-preludio/A2-vectores-y-coordenadas.qmd"
  requiere = ["A1"]

